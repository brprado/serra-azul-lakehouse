# Carga inicial sintética do ERP (18 meses) na landing. Execução única e determinística:
# rodar de novo sobrescreve com os mesmos dados. Especificação: docs/caso-de-negocio.md, seção 5.1.
resources:
  jobs:
    erp_initial_load:
      name: erp_initial_load
      description: Gera o dump histórico do ERP e a referência de CEPs na landing (core.landing.erp / core.landing.ref).
      max_concurrent_runs: 1
      tasks:
        - task_key: generate
          environment_key: default
          spark_python_task:
            python_file: ../data_gen/erp/erp_initial_load.py
            parameters:
              - --catalog
              - ${var.catalog_core}
              - --start
              - "2025-04-19"
              - --end
              - "2026-10-18"
              - --extraction-date
              - "2026-10-19"
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - faker>=33,<38
